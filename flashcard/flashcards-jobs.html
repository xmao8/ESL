  { word: "Machine Operator", definition: "Runs and monitors industrial machines.", example: "The machine operator checked the safety controls.", translation: "<b>中文</b>：机台操作员 (jītái cāozuòyuán)　<b>Español</b>：operador/a de máquina" },
  { word: "Medical Assistant", definition: "Supports doctors with patient care and administrative tasks.", example: "The medical assistant took my blood pressure.", translation: "<b>中文</b>：医务助理 (yīwù zhùlǐ)　<b>Español</b>：asistente médico/a" },
  { word: "Dental Hygienist", definition: "Cleans teeth and educates patients on dental care.", example: "The dental hygienist performed a routine cleaning.", translation: "<b>中文</b>：牙科卫生员 (yákē wèishēngyuán)　<b>Español</b>：higienista dental" },
  { word: "Physical Therapist", definition: "Helps patients recover movement and manage pain.", example: "The physical therapist designed exercises for my knee.", translation: "<b>中文</b>：物理治疗师 (wùlǐ zhìliáoshī)　<b>Español</b>：fisioterapeuta" },
  { word: "Caregiver", definition: "Provides daily care for children, seniors, or people with disabilities.", example: "The caregiver assisted the client with meals and bathing.", translation: "<b>中文</b>：照护员 (zhàohùyuán)　<b>Español</b>：cuidador/a" },
  { word: "Home Health Aide", definition: "Offers basic health support at a patient’s home.", example: "The home health aide checked the client’s vital signs.", translation: "<b>中文</b>：家庭护理员 (jiātíng hùlǐyuán)　<b>Español</b>：asistente de salud a domicilio" },
  { word: "Laboratory Technician", definition: "Performs tests and analyzes samples in a lab.", example: "The laboratory technician prepared the blood samples.", translation: "<b>中文</b>：实验室技术员 (shíyànshì jìshùyuán)　<b>Español</b>：técnico/a de laboratorio" },

];

let index = 0;
let flipped = false;
const flashcard = document.getElementById("flashcard");

function showCard() {
  flipped = false;
  flashcard.classList.remove("flipped");
  const { word } = flashcards[index];
  flashcard.innerHTML = `
    <div class="word">${word}</div>
    <div style="font-size:1rem; margin-top:1rem; color:#888;">Click to flip for definition</div>
  `;
}

function flipCard() {
  if (!flipped) {
    const { word, definition, example, translation } = flashcards[index];
    flashcard.innerHTML = `
      <div class="word">${word}
        <span class="speaker" role="button" tabindex="0">🔊</span>
      </div>
      <div class="definition">${definition}</div>
      <div class="example">"${example}"</div>
      <div class="translation">${translation}</div>
      <div style="font-size:1rem; margin-top:1rem; color:#eee;">Click to flip back</div>
    `;
    flashcard.classList.add("flipped");
    flipped = true;
    const speakerBtn = flashcard.querySelector(".speaker");
    speakerBtn.addEventListener("click", () => {
      const utter = new SpeechSynthesisUtterance(word);
      utter.lang = 'en-US';
      speechSynthesis.speak(utter);
    });
  } else { showCard(); }
}

function nextCard() { index = (index + 1) % flashcards.length; showCard(); }
function prevCard() { index = (index - 1 + flashcards.length) % flashcards.length; showCard(); }

showCard();

// Autoplay
let autoplay = false;
let autoplayBtn = document.getElementById("autoplayBtn");
autoplayBtn.addEventListener("click", () => {
  autoplay = !autoplay;
  autoplayBtn.textContent = autoplay ? "⏸ Autoplay On" : "▶ Autoplay Off";
  if (autoplay) autoplaySequence();
});
async function autoplaySequence() {
  while (autoplay) {
    showCard(); await new Promise(r => setTimeout(r, 500));
    flipCard(); await new Promise(r => setTimeout(r, 2000));
    nextCard();
  }
}
</script>
