  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0b1020;
      text-align: center;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      color: #e8eefc;
    }
    nav { background: #111a3a; margin: 0; padding: 0; border-bottom: 2px solid #23336b; }
    .nav-container {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; max-width: 1100px; margin: 0 auto; padding: 0.8rem 1rem; box-sizing: border-box;
    }
    .logo {
      display: flex; align-items: center; color: #ff9800;
      font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 1.3rem; text-decoration: none;
    }
    .logo-img { width: 32px; height: 32px; margin-right: 0.5rem; }
    .nav-links { display: flex; gap: 1rem; }
    .nav-links a { color: #e8eefc; font-weight: 700; text-decoration: none; transition: color 0.2s ease; }
    .nav-links a:hover, .nav-links a:focus { color: #ffbb33; outline: none; }
    .menu-toggle { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 0; }
    .menu-toggle .bar { width: 25px; height: 3px; background: #e8eefc; border-radius: 2px; }

    @media (max-width: 600px) {
      .nav-links { position: fixed; top: 56px; right: 0; background: #111a3a; flex-direction: column; width: 0%; height: calc(100vh - 56px); padding: 1rem 1.5rem 2rem 1.5rem; gap: 1.2rem; overflow-y: auto; transform: translateX(100%); transition: transform 0.3s ease; border-radius: 0 0 0 10px; z-index: 999; box-sizing: border-box; align-items: flex-start; }
      .nav-links.active { transform: translateX(0); }
      .menu-toggle { display: flex; }
      h1, .flashcard, .buttons { padding: 0 1rem; box-sizing: border-box; }
    }
    @media (min-width: 601px) and (max-width: 900px) {
      .nav-container { padding: 0.8rem 1.5rem; }
      .nav-links { position: static; flex-direction: row; background: none; height: auto; width: auto; padding: 0; gap: 1.3rem; transform: none !important; border-radius: 0; align-items: center; overflow: visible; }
      .menu-toggle { display: none; }
      h1, .flashcard, .buttons { padding: 0 1.5rem; box-sizing: border-box; }
    }
    @media (min-width: 901px) {
      .nav-container { max-width: 1100px; margin: 0 auto; padding: 0.8rem 1rem; }
      .nav-links { position: static; flex-direction: row; background: none; height: auto; width: auto; padding: 0; gap: 1.5rem; transform: none !important; border-radius: 0; align-items: center; overflow: visible; }
      .menu-toggle { display: none; }
      body { padding: 0; }
      h1, .flashcard, .buttons { padding: 0; }
    }

    h1 { margin: 2rem auto 0.5rem; color: #ffbb33; max-width: 860px; }
    .muted { color: #b7c5f0; font-size: 0.9rem; margin: 0 0 1rem; }

    .flashcard {
      background: #182346; width: 90%; max-width: 700px; margin: 1.2rem auto 2rem; padding: 2rem; border-radius: 14px; box-shadow: 0 6px 16px rgba(0,0,0,0.35); font-size: 1.2rem; cursor: pointer; transition: background-color 0.3s ease, color 0.3s ease; user-select: none; border: 1px solid #2a3b7a;
    }
    .flashcard.flipped { background-color: #2a3b7a; color: #ffffff; }
    .word { font-weight: bold; font-size: 2rem; margin-bottom: 0.3rem; display: flex; justify-content: center; align-items: center; gap: 0.8rem; }
    .definition { margin-top: 1rem; font-size: 1.05rem; color: #d8e1ff; }
    .example { font-style: italic; color: #c6d3ff; margin-top: 0.5rem; }
    .translation { font-size: 0.95rem; margin-top: 0.4rem; color: #d8e1ff; }
    .speaker { cursor: pointer; font-size: 1.6rem; color: #ffbb33; user-select: none; transition: transform 0.1s; }
    .speaker:active { transform: scale(0.95); }

    .buttons { margin: 0.8rem auto 2.2rem; display: flex; justify-content: center; flex-wrap: wrap; gap: 0.6rem; max-width: 760px; }
    button, .buttons a { padding: 0.6rem 1rem; background: #ff6b35; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; user-select: none; transition: opacity 0.2s ease; }
    button:hover, .buttons a:hover { opacity: 0.9; }
    .helper { font-size: 1rem; margin-top: 1rem; color: #c6d3ff; }
  </style>

<h1>Halloween – Flashcards (Intermediate)</h1>
<p class="muted" id="progress">Card 1 of 30</p>

<div id="flashcard" class="flashcard" onclick="flipCard()" role="button" aria-pressed="false" tabindex="0" onkeydown="if(event.key==='Enter' || event.key===' ') flipCard()">
  <div class="word">Click to Flip</div>
  <div class="helper">Click to flip for definition</div>
</div>

<div class="buttons">
  <button id="autoplayBtn" aria-pressed="false" aria-label="Toggle autoplay">▶ Autoplay Off</button>
  <button id="shuffleBtn" aria-label="Shuffle deck">🔀 Shuffle</button>
  <button onclick="prevCard()" aria-label="Previous flashcard">⬅ Previous</button>
  <button onclick="nextCard()" aria-label="Next flashcard">Next ➡</button>
</div>

<script>
const flashcards = [
  { word: "Halloween", definition: "A holiday on October 31st when people wear costumes, decorate, and give out candy.", example: "We carved pumpkins for Halloween this year.", chinese: "万圣节", spanish: "Noche de Brujas / Halloween" },
  { word: "pumpkin", definition: "A large round orange fruit used for food and decoration.", example: "He baked a pumpkin pie for the party.", chinese: "南瓜", spanish: "calabaza" },
  { word: "jack-o'-lantern", definition: "A carved pumpkin with a face and a light inside.", example: "The glowing jack-o'-lantern sat on the porch.", chinese: "南瓜灯", spanish: "calabaza tallada (linterna de calabaza)" },
  { word: "costume", definition: "Clothes worn to look like someone or something else.", example: "Her witch costume was very creative.", chinese: "化装服 / 服装", spanish: "disfraz" },
  { word: "mask", definition: "A covering for the face.", example: "He wore a skeleton mask to the parade.", chinese: "面具", spanish: "máscara" },
  { word: "cape", definition: "A long piece of cloth worn over the shoulders.", example: "The vampire wore a black cape.", chinese: "披风", spanish: "capa" },
  { word: "witch", definition: "A woman who uses magic in stories and legends.", example: "The witch flew across the moon.", chinese: "女巫", spanish: "bruja" },
  { word: "wizard", definition: "A man who uses magic in stories and legends.", example: "The old wizard brewed a potion.", chinese: "巫师 / 男巫", spanish: "mago" },
  { word: "ghost", definition: "The spirit of a dead person in stories.", example: "We told a ghost story in the dark.", chinese: "鬼 / 幽灵", spanish: "fantasma" },
  { word: "ghoul", definition: "An evil creature from stories that feeds on the dead.", example: "A ghoul was lurking in the graveyard.", chinese: "食尸鬼", spanish: "ghoul (espíritu necrófago)" },
  { word: "vampire", definition: "A creature that drinks blood in horror stories.", example: "The vampire avoids sunlight.", chinese: "吸血鬼", spanish: "vampiro" },
  { word: "werewolf", definition: "A person who turns into a wolf during a full moon in stories.", example: "The werewolf howled at midnight.", chinese: "狼人", spanish: "hombre lobo" },
  { word: "mummy", definition: "A preserved dead body wrapped in cloth, often from ancient Egypt.", example: "The mummy came to life in the movie.", chinese: "木乃伊", spanish: "momia" },
  { word: "skeleton", definition: "All the bones of a body; often used as a decoration.", example: "A plastic skeleton hung on the door.", chinese: "骷髅", spanish: "esqueleto" },
  { word: "zombie", definition: "A dead body brought back to life in horror stories.", example: "Zombies walked slowly through the streets.", chinese: "僵尸", spanish: "zombi" },
  { word: "coffin", definition: "A box where a dead person is placed for burial.", example: "In the story, the vampire slept in a coffin.", chinese: "棺材", spanish: "ataúd" },
  { word: "tombstone", definition: "A stone that marks a grave.", example: "The tombstone had the date carved on it.", chinese: "墓碑", spanish: "lápida" },
  { word: "haunted house", definition: "A building believed to have ghosts or scary things inside.", example: "We screamed in the haunted house.", chinese: "鬼屋", spanish: "casa embrujada" },
  { word: "cobweb", definition: "A dusty spider web found in old places.", example: "Cobwebs covered the corners of the attic.", chinese: "蛛网 / 旧网", spanish: "telaraña" },
  { word: "spider", definition: "An eight-legged creature that spins webs.", example: "A fake spider was on the wall.", chinese: "蜘蛛", spanish: "araña" },
  { word: "bat", definition: "A small flying animal that is active at night.", example: "We saw a bat fly over the yard.", chinese: "蝙蝠", spanish: "murciélago" },
  { word: "cauldron", definition: "A large pot used for boiling, often in witch stories.", example: "The witch stirred the cauldron slowly.", chinese: "大锅 / 坩埚", spanish: "caldero" },
  { word: "broomstick", definition: "A broom; in stories, witches ride on it.", example: "She pretended to fly on a broomstick.", chinese: "扫帚（柄）", spanish: "escoba" },
  { word: "potion", definition: "A magic liquid used in stories.", example: "The potion turned him invisible.", chinese: "魔药 / 药剂", spanish: "poción" },
  { word: "curse", definition: "A magical spell that brings bad luck.", example: "They tried to break the curse.", chinese: "诅咒", spanish: "maldición" },
  { word: "trick-or-treat", definition: "A Halloween activity where children ask for candy door to door.", example: "The kids went trick-or-treating after sunset.", chinese: "不给糖就捣蛋", spanish: "truco o trato" },
  { word: "candy", definition: "Sweet food made of sugar.", example: "We sorted our Halloween candy by type.", chinese: "糖果", spanish: "dulces" },
  { word: "lantern", definition: "A light inside a case that can be carried.", example: "He carried a lantern to light the path.", chinese: "灯笼", spanish: "farol" },
  { word: "spooky", definition: "Strange and a little scary.", example: "The music made a spooky atmosphere.", chinese: "诡异的 / 吓人的", spanish: "espeluznante" },
  { word: "eerie", definition: "Weird in a way that makes you feel uneasy.", example: "An eerie silence filled the hallway.", chinese: "阴森的 / 怪异的", spanish: "tenebroso / inquietante" }
];

let index = 0;
let flipped = false;
const flashcard = document.getElementById('flashcard');
const progress = document.getElementById('progress');

function updateProgress(){ progress.textContent = `Card ${index + 1} of ${flashcards.length}`; }
function showCard(){ flipped=false;flashcard.classList.remove('flipped');flashcard.setAttribute('aria-pressed','false');const{word}=flashcards[index];flashcard.innerHTML=`<div class="word">${word}<span class="speaker">🔊</span></div><div class="helper">Click to flip for definition</div>`;updateProgress();attachSpeaker(word);} 
function flipCard(){ if(!flipped){const{word,definition,example,chinese,spanish}=flashcards[index];flashcard.innerHTML=`<div class="word">${word}<span class="speaker">🔊</span></div><div class="definition">${definition}</div><div class="example">"${example}"</div><div class="translation">Chinese (中文): ${chinese}</div><div class="translation">Spanish (Español): ${spanish}</div><div class="helper">Click to flip back</div>`;flashcard.classList.add('flipped');flipped=true;attachSpeaker(word);speak(word);}else{showCard();} }
function nextCard(){index=(index+1)%flashcards.length;showCard();}
function prevCard(){index=(index-1+flashcards.length)%flashcards.length;showCard();}
function shuffleDeck(){for(let i=flashcards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[flashcards[i],flashcards[j]]=[flashcards[j],flashcards[i]];}index=0;showCard();}
function speak(t){try{speechSynthesis.cancel();}catch(e){}const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.95;speechSynthesis.speak(u);}
function attachSpeaker(word){const btn=flashcard.querySelector('.speaker');if(!btn)return;btn.onclick=()=>speak(word);} 
showCard();
</script>
