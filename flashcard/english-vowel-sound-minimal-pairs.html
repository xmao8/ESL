<h1>Minimal Pairs: Vowel Sounds</h1>

<div id="flashcard" class="flashcard" onclick="flipCard()">
  Click to Flip
</div>

<div class="buttons">
  <button onclick="prevCard()">⬅ Previous</button>
  <button onclick="nextCard()">Next ➡</button>
</div>

<script>
const flashcards = [
  {
    ipa: "/iː/ vs /ɪ/",
    pairs: [
      "sheep /ʃiːp/ – ship /ʃɪp/",
      "leave /liːv/ – live /lɪv/",
      "green /ɡriːn/ – grin /ɡrɪn/",
      "feet /fiːt/ – fit /fɪt/"
    ]
  },
  {
    ipa: "/ɪ/ vs /e/",
    pairs: [
      "sit /sɪt/ – set /set/",
      "pin /pɪn/ – pen /pen/",
      "list /lɪst/ – lest /lest/",
      "did /dɪd/ – dead /ded/"
    ]
  },
  {
    ipa: "/e/ vs /æ/",
    pairs: [
      "bed /bed/ – bad /bæd/",
      "men /men/ – man /mæn/",
      "said /sed/ – sad /sæd/",
      "red /red/ – rad /ræd/"
    ]
  },
  {
    ipa: "/æ/ vs /ʌ/",
    pairs: [
      "cat /kæt/ – cut /kʌt/",
      "bag /bæɡ/ – bug /bʌɡ/",
      "ran /ræn/ – run /rʌn/",
      "hat /hæt/ – hut /hʌt/"
    ]
  },
  {
    ipa: "/ʌ/ vs /ɑː/",
    pairs: [
      "cup /kʌp/ – carp /kɑːrp/",
      "duck /dʌk/ – dark /dɑːrk/",
      "fun /fʌn/ – farn /fɑːrn/"
    ]
  },
  {
    ipa: "/ʊ/ vs /uː/",
    pairs: [
      "look /lʊk/ – Luke /luːk/",
      "pull /pʊl/ – pool /puːl/",
      "could /kʊd/ – cooled /kuːld/"
    ]
  },
  {
    ipa: "/ɒ/ vs /ɑː/",
    pairs: [
      "cot /kɒt/ – cart /kɑːrt/",
      "shot /ʃɒt/ – shart /ʃɑːrt/"
    ]
  },
  {
    ipa: "/eɪ/ vs /e/",
    pairs: [
      "dayt /deɪt/ – debt /det/",
      "sayl /seɪl/ – sell /sel/",
      "gate /ɡeɪt/ – get /ɡet/"
    ]
  },
  {
    ipa: "/aɪ/ vs /ɔɪ/",
    pairs: [
      "buy /baɪ/ – boy /bɔɪ/",
      "tile /taɪl/ – toil /tɔɪl/",
      "like /laɪk/ – loin /lɔɪn/"
    ]
  },
  {
    ipa: "/oʊ/ vs /aʊ/",
    pairs: [
      "road /roʊd/ – roud /raʊd/",
      "not /noʊt/ – nout /naʊt/",
      "howl /haʊl/ – hole /hoʊl/"
    ]
  },
  {
    ipa: "/uː/ vs /juː/",
    pairs: [
      "loot /luːt/ – lute /ljuːt/",
      "toon /tuːn/ – tune /tjuːn/"
    ]
  }
];

let index = 0;
let flipped = false;
const card = document.getElementById("flashcard");

function showCard() {
  card.classList.remove("flipped");
  flipped = false;
  card.innerHTML = `<div class="ipa">${flashcards[index].ipa}</div>`;
}

function flipCard() {
  if (!flipped) {
    const { ipa, pairs } = flashcards[index];
    card.innerHTML = `
      <div class="ipa">${ipa}</div>
      <ul class="pairs">
        ${pairs.map(p => `<li>${p}</li>`).join("")}
      </ul>
    `;
    card.classList.add("flipped");
    pronounceSamples();
    flipped = true;
  } else {
    showCard();
  }
}

function pronounceSamples() {
  const { pairs } = flashcards[index];
  pairs.forEach(pair => {
    // split into two words before the IPA slash
    const [left, right] = pair.split(' – ');
    const word1 = left.split(' ')[0];
    const word2 = right.split(' ')[0];
    [word1, word2].forEach(word => {
      const u = new SpeechSynthesisUtterance(word);
      u.lang = 'en-US';
      u.rate = 0.9;
      speechSynthesis.speak(u);
    });
  });
}

function nextCard() {
  index = (index + 1) % flashcards.length;
  showCard();
}

function prevCard() {
  index = (index - 1 + flashcards.length) % flashcards.length;
  showCard();
}

// initialize
showCard();
</script>
